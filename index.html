<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Gamer Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 30px auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .price { color: #4ade80; font-size: 1.3rem; font-weight: bold; margin: 10px 0; }
        .btn { background: #25d366; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <h1>🎮 TIENDA DE JUEGOS DIGITALES</h1>
    <p>Selecciona tu juego para comprar directo por WhatsApp</p>

    <div class="grid">
        <div class="card">
            <h3>Juego 1 (PS4 / PS5)</h3>
            <div class="price">$15.00</div>
            <button class="btn" onclick="comprar('Juego 1', 15)">Comprar por WhatsApp</button>
        </div>
        <div class="card">
            <h3>Juego 2 (PS4 / PS5)</h3>
            <div class="price">$20.00</div>
            <button class="btn" onclick="comprar('Juego 2', 20)">Comprar por WhatsApp</button>
        </div>
    </div>

    <script>
        const TELEFONO = "584120000000"; // Pon aquí tu número de WhatsApp
        function comprar(juego, precio) {
            const mensaje = `Hola! Quiero comprar: *${juego}* ($${precio})`;
            window.open(`https://wa.me/${TELEFONO}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }
    </script>

</body>
</html>
